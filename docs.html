<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JioSaavn API docs</title>
<style>
  :root {
    --bg: #eef3f1;
    --surface: #ffffff;
    --text: #15262a;
    --muted: #55696d;
    --line: #cfdcd8;
    --accent: #0c7a70;
    --accent-ink: #ffffff;
    --code-bg: #0f2a2e;
    --code-text: #d6ece8;
    --warn: #8a5a00;
    --err: #b3261e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1c1f;
      --surface: #14272b;
      --text: #e3efec;
      --muted: #90a9a5;
      --line: #25403f;
      --accent: #3fc7b8;
      --accent-ink: #062623;
      --code-bg: #081416;
      --code-text: #cfe6e1;
      --warn: #e8b04a;
      --err: #ff8a80;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    line-height: 1.6;
  }
  code, pre, .path, input, textarea { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  a { color: var(--accent); }

  .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); max-width: 1120px; margin: 0 auto; }

  nav.side {
    position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto;
    padding: 28px 20px; border-right: 1px solid var(--line);
  }
  nav.side .brand { font-size: 1.15rem; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 4px; }
  nav.side .sub { color: var(--muted); font-size: .85rem; margin: 0 0 22px; }
  nav.side a {
    display: block; padding: 7px 10px; margin: 0 -10px; border-radius: 6px;
    color: var(--text); text-decoration: none; font-size: .92rem;
  }
  nav.side a:hover, nav.side a:focus-visible { background: var(--surface); outline: none; }
  nav.side a.active { background: var(--surface); box-shadow: inset 3px 0 0 var(--accent); font-weight: 600; }
  nav.side a .path { font-size: .85rem; }

  main { padding: 40px 32px 96px; min-width: 0; }

  .hero h1 { font-size: clamp(2rem, 5vw, 3.1rem); line-height: 1.08; letter-spacing: -0.03em; margin: 0 0 14px; font-weight: 750; }
  .hero p { max-width: 62ch; color: var(--muted); margin: 0 0 22px; font-size: 1.05rem; }

  .base {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px;
  }
  .base label { font-weight: 600; font-size: .9rem; }
  .base input { flex: 1 1 260px; min-width: 0; }

  .status { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: #1fa971; }
  .dot.bad { background: var(--err); }

  .notes { margin: 26px 0 8px; padding: 14px 16px; border-left: 3px solid var(--warn); background: var(--surface); border-radius: 0 8px 8px 0; font-size: .95rem; }
  .notes p { margin: 0 0 6px; }
  .notes p:last-child { margin: 0; }

  section.ep { padding-top: 44px; border-top: 1px solid var(--line); margin-top: 44px; }
  section.ep header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .method { font-weight: 700; color: var(--accent); font-size: .95rem; }
  .path { font-size: 1.2rem; font-weight: 600; word-break: break-all; }
  section.ep h2 { margin: 0; font-size: 1.2rem; }
  section.ep .desc { color: var(--muted); max-width: 64ch; margin: 8px 0 18px; }

  table { width: 100%; border-collapse: collapse; font-size: .92rem; margin-bottom: 18px; }
  th { text-align: left; font-weight: 600; color: var(--muted); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); }
  td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td:first-child { white-space: nowrap; }
  .req { color: var(--err); font-weight: 600; }

  .try { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .try h3 { margin: 0 0 12px; font-size: 1rem; }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 14px; }
  .field label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: 4px; }
  input[type=text], select {
    width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: .9rem;
  }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  button {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
    padding: 9px 18px; font-size: .92rem; font-weight: 650; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button[disabled] { opacity: .6; cursor: progress; }
  .url { font-size: .82rem; color: var(--muted); word-break: break-all; flex: 1 1 100%; }

  pre {
    margin: 0; padding: 14px; border-radius: 8px; background: var(--code-bg); color: var(--code-text);
    overflow: auto; max-height: 360px; font-size: .82rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
  }
  .meta { font-size: .82rem; color: var(--muted); margin: 8px 0 0; }

  @media (max-width: 820px) {
    .layout { display: block; }
    nav.side {
      position: sticky; top: 0; z-index: 5; height: auto; display: flex; gap: 6px; overflow-x: auto;
      padding: 10px 14px; background: var(--bg); border-right: 0; border-bottom: 1px solid var(--line);
    }
    nav.side .brand, nav.side .sub { display: none; }
    nav.side a { white-space: nowrap; margin: 0; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; }
    nav.side a.active { box-shadow: none; border-color: var(--accent); }
    main { padding: 28px 16px 80px; }
    td:first-child { white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<div class="layout">
  <nav class="side" aria-label="Endpoints" id="nav">
    <p class="brand">JioSaavn API</p>
    <p class="sub">Unofficial, Flask</p>
  </nav>

  <main>
    <div class="hero">
      <h1>Search songs, albums and playlists from JioSaavn</h1>
      <p>Every endpoint is a GET request that returns JSON. Pass a song name or a JioSaavn link as <code>query</code>, and add <code>lyrics=true</code> when you want lyrics included.</p>
    </div>

    <div class="base">
      <label for="base">Base URL</label>
      <input type="text" id="base" spellcheck="false" autocomplete="off">
      <span class="status"><span class="dot" id="dot"></span><span id="statusText">Not checked</span></span>
      <button class="ghost" id="ping" type="button">Check status</button>
    </div>
    <div id="endpoints"></div>
  </main>
</div>

<script>
const ENDPOINTS = [
  {
    id: "root", path: "/", title: "Status and route list",
    desc: "Returns whether the API is running, who made it, and every available route with its parameters.",
    params: []
  },
  {
    id: "result", path: "/result/", title: "Universal search",
    desc: "One endpoint for everything. Send a song name and you get search results. Send a song, album or playlist link and it detects which one it is.",
    params: [
      { name: "query", req: true,  desc: "Song name, or a JioSaavn song, album or playlist link.", example: "alone" },
      { name: "lyrics", req: false, desc: "Set to true to include lyrics. Default false.", type: "bool" }
    ]
  },
  {
    id: "song", path: "/song/", title: "Search songs",
    desc: "Searches by name or takes a song link. By default each match is expanded to full song details.",
    params: [
      { name: "query", req: true,  desc: "Song name or JioSaavn song link.", example: "khairiyat" },
      { name: "lyrics", req: false, desc: "Set to true to include lyrics. Default false.", type: "bool" },
      { name: "songdata", req: false, desc: "Set to false to return the raw search matches without fetching full details. Default true.", type: "bool", def: "" }
    ]
  },
  {
    id: "songget", path: "/song/get/", title: "Get a song by ID",
    desc: "Returns full details for one song when you already have its JioSaavn ID.",
    params: [
      { name: "id", req: true,  desc: "JioSaavn song ID, for example from a search result.", example: "" },
      { name: "lyrics", req: false, desc: "Set to true to include lyrics. Default false.", type: "bool" }
    ]
  },
  {
    id: "playlist", path: "/playlist/", title: "Playlist",
    desc: "Returns a playlist and all of its songs.",
    params: [
      { name: "query", req: true,  desc: "JioSaavn playlist link.", example: "https://www.jiosaavn.com/featured/romantic-hits-2020---hindi/ABiMGqjovSFuOxiEGmm6lQ" },
      { name: "lyrics", req: false, desc: "Set to true to include lyrics. Default false.", type: "bool" }
    ]
  },
  {
    id: "album", path: "/album/", title: "Album",
    desc: "Returns an album and all of its songs.",
    params: [
      { name: "query", req: true,  desc: "JioSaavn album link.", example: "https://www.jiosaavn.com/album/chhichhore/V4F3M5,cNb4" },
      { name: "lyrics", req: false, desc: "Set to true to include lyrics. Default false.", type: "bool" }
    ]
  },
  {
    id: "lyrics", path: "/lyrics/", title: "Lyrics",
    desc: "Returns lyrics for a single song, by link or by ID.",
    params: [
      { name: "query", req: true, desc: "JioSaavn song link or song ID.", example: "https://www.jiosaavn.com/song/khairiyat/PwAFSRNpAWw" }
    ]
  }
];

const $ = (s, el = document) => el.querySelector(s);
const baseInput = $("#base");
baseInput.value = location.protocol.startsWith("http") ? location.origin : "https://jiosaavnsearch-py.vercel.app";
const getBase = () => baseInput.value.trim().replace(/\/+$/, "");

// Build nav and sections
const nav = $("#nav");
const wrap = $("#endpoints");

ENDPOINTS.forEach(ep => {
  const a = document.createElement("a");
  a.href = "#" + ep.id;
  a.dataset.id = ep.id;
  a.innerHTML = `<span class="path">${ep.path}</span>`;
  nav.appendChild(a);

  const s = document.createElement("section");
  s.className = "ep";
  s.id = ep.id;

  const rows = ep.params.map(p => `
    <tr>
      <td><code>${p.name}</code></td>
      <td>${p.req ? '<span class="req">required</span>' : "optional"}</td>
      <td>${p.desc}</td>
    </tr>`).join("");

  const fields = ep.params.map(p => {
    if (p.type === "bool") {
      const opts = p.def === "" ? ["", "true", "false"] : ["", "true", "false"];
      return `<div class="field"><label for="${ep.id}-${p.name}">${p.name}</label>
        <select id="${ep.id}-${p.name}" data-param="${p.name}">
          <option value="">not set</option><option value="true">true</option><option value="false">false</option>
        </select></div>`;
    }
    return `<div class="field"><label for="${ep.id}-${p.name}">${p.name}${p.req ? " (required)" : ""}</label>
      <input type="text" id="${ep.id}-${p.name}" data-param="${p.name}" spellcheck="false" autocomplete="off" value="${(p.example || "").replace(/"/g, "&quot;")}"></div>`;
  }).join("");

  s.innerHTML = `
    <header><span class="method">GET</span><span class="path">${ep.path}</span></header>
    <h2 style="margin-top:6px;font-weight:600;color:var(--muted);font-size:1rem">${ep.title}</h2>
    <p class="desc">${ep.desc}</p>
    ${ep.params.length ? `<table><thead><tr><th>Parameter</th><th>Required</th><th>What it does</th></tr></thead><tbody>${rows}</tbody></table>` : ""}
    <div class="try" data-ep="${ep.id}">
      <h3>Try it</h3>
      ${ep.params.length ? `<div class="fields">${fields}</div>` : ""}
      <div class="row">
        <button type="button" class="run">Send request</button>
        <button type="button" class="ghost copy">Copy URL</button>
        <span class="url"></span>
      </div>
      <pre hidden></pre>
      <p class="meta" hidden></p>
    </div>`;
  wrap.appendChild(s);
});

function buildUrl(ep, box) {
  const qs = new URLSearchParams();
  box.querySelectorAll("[data-param]").forEach(el => {
    if (el.value.trim() !== "") qs.set(el.dataset.param, el.value.trim());
  });
  const q = qs.toString();
  return getBase() + ep.path + (q ? "?" + q : "");
}

function refreshUrl(box, ep) { $(".url", box).textContent = buildUrl(ep, box); }

document.querySelectorAll(".try").forEach(box => {
  const ep = ENDPOINTS.find(e => e.id === box.dataset.ep);
  const pre = $("pre", box), meta = $(".meta", box), run = $(".run", box);
  refreshUrl(box, ep);
  box.addEventListener("input", () => refreshUrl(box, ep));
  baseInput.addEventListener("input", () => refreshUrl(box, ep));

  $(".copy", box).addEventListener("click", async e => {
    try { await navigator.clipboard.writeText(buildUrl(ep, box)); e.target.textContent = "Copied"; }
    catch { e.target.textContent = "Copy failed"; }
    setTimeout(() => (e.target.textContent = "Copy URL"), 1400);
  });

  run.addEventListener("click", async () => {
    const url = buildUrl(ep, box);
    run.disabled = true; run.textContent = "Sending";
    pre.hidden = false; meta.hidden = false;
    pre.textContent = "Waiting for response";
    const t0 = performance.now();
    try {
      const res = await fetch(url);
      const text = await res.text();
      let out = text;
      try { out = JSON.stringify(JSON.parse(text), null, 2); } catch {}
      const LIMIT = 12000;
      pre.textContent = out.length > LIMIT ? out.slice(0, LIMIT) + "\n\n... trimmed, " + (out.length - LIMIT) + " more characters" : out;
      meta.textContent = `Status ${res.status}, ${Math.round(performance.now() - t0)} ms, ${text.length.toLocaleString()} characters`;
    } catch (err) {
      pre.textContent = "Request failed: " + err.message + "\n\nCheck that the base URL is correct and the API is running.";
      meta.textContent = "No response";
    } finally {
      run.disabled = false; run.textContent = "Send request";
    }
  });
});

// Status check
async function ping() {
  const dot = $("#dot"), txt = $("#statusText");
  dot.className = "dot"; txt.textContent = "Checking";
  try {
    const res = await fetch(getBase() + "/");
    const data = await res.json();
    if (data && data.status === "active") { dot.className = "dot ok"; txt.textContent = "API is active"; }
    else { dot.className = "dot bad"; txt.textContent = "Unexpected response"; }
  } catch { dot.className = "dot bad"; txt.textContent = "Unreachable"; }
}
$("#ping").addEventListener("click", ping);
ping();

// Highlight current section in nav
const links = [...nav.querySelectorAll("a")];
const io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (en.isIntersecting) {
      links.forEach(l => l.classList.toggle("active", l.dataset.id === en.target.id));
    }
  });
}, { rootMargin: "-20% 0px -70% 0px" });
document.querySelectorAll("section.ep").forEach(s => io.observe(s));
</script>
</body>
</html>
